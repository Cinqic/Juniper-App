name: validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same ref. Without this, a second push
# while a run is still going makes gitleaks-action compute a commit range
# against a head the checkout does not contain, and the job fails on
# "Invalid revision range" rather than on anything real.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.19.0'

jobs:
  validate:
    name: Frontend, native, schemas, and audits
    runs-on: ubuntu-22.04
    # rustsec/audit-check publishes its result as a check run. Without
    # checks: write it fails with "Resource not accessible by integration"
    # after the audit itself has already succeeded. Scoped to this job so
    # the workflow default stays contents: read.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Install Tauri Linux dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
          libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Run native contract tests
        run: bash scripts/run-native-contract-tests.sh
      - run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high
      - run: pnpm validate
      - name: Production frontend build
        run: pnpm build
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-clean-build:
    name: Android clean debug compile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK packages
        run: >-
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          'ndk;29.0.13113456' 'cmake;3.31.6' 'emulator'
          'system-images;android-30;default;x86_64'
      - name: Install Android package audit tools
        run: sudo apt-get update && sudo apt-get install -y unzip zip binutils
      - run: pnpm install --frozen-lockfile
      - name: Initialize Android from a clean checkout
        run: pnpm tauri android init --ci
      - name: Compile debug APK without signing material
        run: pnpm tauri android build --debug --apk --ci --target aarch64 x86_64
      - name: Require exactly one debug APK
        run: |
          mapfile -d '' apks < <(find src-tauri/gen/android -type f -name '*debug*.apk' -print0)
          test "${#apks[@]}" -eq 1
          bash scripts/verify-android-apk.sh "${apks[0]}" android-apk-audit
      - name: Build Android credential-vault instrumentation
        working-directory: src-tauri/gen/android
        run: >-
          bash ./gradlew :juniper-local-runtime:assembleDebugAndroidTest
          -PjuniperNativeAbis=x86_64 --no-daemon --stacktrace
      - name: Run credential instrumentation and lifecycle smoke
        env:
          JUNIPER_CREDENTIAL_TEST_APK: ${{ github.workspace }}/src-tauri/plugins/juniper-local/android/build/outputs/apk/androidTest/debug/juniper-local-runtime-debug-androidTest.apk
        run: |
          mapfile -d '' apks < <(find src-tauri/gen/android -type f -name '*debug*.apk' -print0)
          test "${#apks[@]}" -eq 1
          timeout --foreground 30m bash scripts/run-android-emulator-smoke.sh \
            "${apks[0]}" com.cinqic.juniper android-runtime-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-validation-evidence
          path: |
            android-apk-audit
            android-runtime-evidence
          if-no-files-found: error

  android-inference:
    name: Android native inference smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/android-inference.yml
