name: validation-negative-control

on:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same ref. Without this, a second push
# while a run is still going makes gitleaks-action compute a commit range
# against a head the checkout does not contain, and the job fails on
# "Invalid revision range" rather than on anything real.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.19.0'

jobs:
  # Mirrors the release workflow's Windows job so the MSI build, install,
  # readiness launch, and uninstall are proven before a tag is pushed rather
  # than only after it, when a failure costs an immutable release candidate.
  windows-msi:
    name: Windows MSI build, install, launch, and uninstall smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - name: Build pinned Juniper local runtime
        shell: bash
        run: scripts/build-llama-runtime.sh
      - name: Require the native runtime resource before bundling
        shell: pwsh
        run: if (-not (Test-Path -LiteralPath 'src-tauri/runtime/llama-server.exe' -PathType Leaf)) { throw 'llama-server.exe was not built.' }
      # Native unit tests are excluded on Windows only; see release.yml.
      - run: pnpm validate:no-native-tests
      - name: Build MSI from locked source
        run: pnpm tauri build --bundles msi -- --locked
      - name: Collect exactly one MSI
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $msis = @(Get-ChildItem -Recurse src-tauri/target/release/bundle -Filter *.msi)
          if ($msis.Count -ne 1) { throw "Expected one MSI, found $($msis.Count)." }
          New-Item -ItemType Directory -Force windows-artifacts | Out-Null
          Copy-Item $msis[0].FullName "windows-artifacts/Juniper-$version-windows-x86_64.msi"
      - name: Inspect, install, launch, and uninstall MSI
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./scripts/verify-windows-msi.ps1 `
            -MsiPath "windows-artifacts/Juniper-$version-windows-x86_64.msi" `
            -ExpectedAppVersion $version `
            -ExpectedMsiVersion ((Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).bundle.windows.wix.version) `
            -EvidencePath 'windows-artifacts/SIGNING-windows.txt' `
            -PackageEvidencePath 'windows-artifacts/PACKAGE-windows.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-smoke-evidence
          path: |
            windows-artifacts/*.txt
            windows-artifacts/windows-smoke
          if-no-files-found: warn
